<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="47都道府県を「読み」「地図」「県庁所在地」の3つのモードで答えるクイズ。">
<title>都道府県よみクイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <section id="menu">
    <div class="stack">
      <header style="display:flex;flex-direction:column;gap:8px">
        <span class="eyebrow">全国47都道府県</span>
        <h1>都道府県よみクイズ</h1>
        <p class="lead">遊び方を選んでください。どのモードも47問をランダムな順番で出題します。</p>
      </header>
      <section class="study" id="study" aria-labelledby="studyTitle">
        <div class="study-head">
          <div><h2 id="studyTitle">学習用地図</h2><p>都道府県をタップすると読みと県庁所在地を表示します。</p></div>
          <div class="tools">
            <button class="chip" id="tHide" type="button" aria-pressed="false">名前を隠す</button>
            <button class="chip" id="tZoom" type="button" aria-pressed="false">拡大</button>
          </div>
        </div>
        <div class="smap-scroll" id="smapScroll"></div>
        <div class="legend" id="legend"></div>
        <div class="info empty" id="info" aria-live="polite">地図上の都道府県を選んでください。</div>
      </section>
      <div class="modes" id="modes"></div>
    </div>
  </section>

  <section id="play" hidden>
    <div style="display:flex;flex-direction:column;gap:18px">
      <div class="bar">
        <button class="quit" id="quit" type="button">← メニューへ</button>
        <div class="stats">
          <span>第 <strong id="qnum">1</strong> / <span id="qtotal">47</span> 問</span>
          <span>正解 <strong id="correct">0</strong></span>
        </div>
      </div>
      <div class="progress" aria-hidden="true"><i id="prog"></i></div>

      <div class="board" id="board">
        <div class="board-main" id="boardMain"></div>
        <div class="board-band"></div>
        <div class="board-foot"><span id="footL"></span><span id="footR"></span></div>
      </div>

      <form id="form" autocomplete="off">
        <label for="answer" id="answerLabel">答えを入力</label>
        <div class="row">
          <input type="text" id="answer" lang="ja" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false">
          <button class="btn" id="submit" type="button">答える</button>
          <button class="btn ghost" id="skip" type="button">わからない</button>
        </div>
        <div class="feedback" id="feedback" aria-live="polite" hidden></div>
        <p class="hintline" id="hintline"></p>
      </form>
    </div>
  </section>

  <section id="result" hidden>
    <div style="display:flex;flex-direction:column;gap:20px">
      <span class="eyebrow" id="resultMode">結果</span>
      <div class="score"><span class="big" id="final">0</span><span class="of">/ <span id="finalTotal">47</span> 問正解</span></div>
      <p class="rank" id="rank"></p>
      <p class="lead" id="time"></p>
      <div class="result-map" id="resultMap" hidden></div>
      <div class="misses" id="misses"></div>
      <div class="actions">
        <button class="btn" id="retryMiss" type="button">間違えた問題だけ再挑戦</button>
        <button class="btn ghost" id="again" type="button">47問もう一度</button>
        <button class="btn ghost" id="toMenu" type="button">メニューへ</button>
      </div>
    </div>
  </section>

</div>

<script src="js/map-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
